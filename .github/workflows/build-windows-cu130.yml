
name: Build Nunchaku Windows CUDA 13.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheel:
    name: Windows - Python 3.13 - Torch 2.14 - CUDA 13.0
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      NUNCHAKU_INSTALL_MODE: ALL
      NUNCHAKU_BUILD_WHEELS: "1"
      NVCC_PREPEND_FLAGS: "-allow-unsupported-compiler"
      MAX_JOBS: "2"

    steps:
      - name: Checkout Nunchaku
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install CUDA Toolkit 13.0
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://developer.download.nvidia.com/compute/cuda/13.0.1/network_installers/cuda_13.0.1_windows_network.exe"
          $installer = Join-Path $env:RUNNER_TEMP "cuda_13.0.1_windows_network.exe"

          Write-Host "Downloading CUDA Toolkit 13.0.1..."
          Invoke-WebRequest -Uri $url -OutFile $installer

          if (!(Test-Path $installer)) {
            throw "CUDA installer was not downloaded"
          }

          $components = @(
            "nvcc_13.0",
            "cudart_13.0",
            "crt_13.0",
            "nvvm_13.0",
            "nvfatbin_13.0",
            "nvjitlink_13.0",
            "cublas_13.0",
            "cublas_dev_13.0",
            "nvrtc_13.0",
            "nvrtc_dev_13.0",
            "thrust_13.0",
            "visual_studio_integration_13.0"
          )

          Write-Host "Installing CUDA Toolkit..."
          $installArgs = @("-s", "-n") + $components

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList $installArgs `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "CUDA installer failed with exit code $($process.ExitCode)"
          }

          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.0"

          if (!(Test-Path "$cudaPath\bin\nvcc.exe")) {
            throw "CUDA installation incomplete: nvcc.exe not found"
          }

          "CUDA_PATH=$cudaPath" >> $env:GITHUB_ENV
          "CUDA_HOME=$cudaPath" >> $env:GITHUB_ENV
          "$cudaPath\bin" >> $env:GITHUB_PATH

          Write-Host "CUDA Toolkit installed successfully"


      - name: Configure CUDA environment
        shell: pwsh
        run: |
          echo "CUDA_HOME=$env:CUDA_PATH" >> $env:GITHUB_ENV
          nvcc --version
          cl

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel ninja build packaging

      - name: Install PyTorch 2.14 CUDA 13.0
        shell: pwsh
        run: |
          python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cu130

      - name: Check PyTorch
        shell: pwsh
        run: |
          python -c "import torch; print('Torch:', torch.__version__); print('CUDA:', torch.version.cuda)"

      - name: Build Nunchaku wheel
        shell: pwsh
        run: |
          python -m build --wheel --no-isolation

      - name: Show built wheels
        shell: pwsh
        run: |
          Get-ChildItem dist\*.whl

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: nunchaku-win-py313-torch214-cu130
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14
